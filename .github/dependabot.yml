# Dependabot opens pull requests for outdated or vulnerable dependencies, including the pinned
# GitHub Action hashes. Every one of them goes through the normal CI before it can be merged.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: {interval: weekly}
    groups:
      spring-boot: {patterns: ["org.springframework*"]}
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    groups:
      minor-and-patch: {update-types: [minor, patch]}
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /backend
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /frontend
    schedule: {interval: weekly}
