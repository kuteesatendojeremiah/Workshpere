server:
  port: 8080

spring:
  application:
    name: worksphere-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/worksphere}
    username: ${DB_USER:worksphere}
    password: ${DB_PASSWORD:worksphere}
  data:
    web:
      pageable:
        default-page-size: 20
        # The Kanban board asks for 200 per column; anything larger is clamped, not honoured.
        max-page-size: 200
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Short timeouts: if Redis is down we fail open quickly instead of hanging every request.
      timeout: 300ms
      # Commands time out fast (we fail open); connecting gets longer because a cold JVM's first
      # connection can take more than a few hundred milliseconds.
      connect-timeout: 2s
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # Fail fast when Kafka is down: the outbox relay just retries later.
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000
        max.block.ms: 3000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record

app:
  # "production" switches on ProductionConfigGuard: the app refuses to start with development secrets.
  environment: ${APP_ENVIRONMENT:local}
  # Browser origins allowed to call the API / open the WebSocket (comma separated).
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Creates a demo organization on an empty database. Development only.
  seed:
    demo: ${SEED_DEMO_DATA:false}
  observability:
    # Bearer token Prometheus must present to read /actuator/prometheus. Empty = that endpoint is closed.
    metrics-token: ${METRICS_TOKEN:}
  billing:
    # Shared with the payment provider. The default is for local development ONLY.
    webhook-secret: ${WEBHOOK_SECRET:local-development-only-webhook-secret}
    webhook-tolerance-seconds: 300
  mail:
    from: ${MAIL_FROM:no-reply@worksphere.local}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    log-tokens: ${MAIL_LOG_TOKENS:false}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:worksphere}
    secret-key: ${STORAGE_SECRET_KEY:worksphere-secret}
    bucket: ${STORAGE_BUCKET:worksphere-files}
  outbox:
    topic: worksphere.events
    poll-interval-ms: 1000
  jwt:
    secret: ${JWT_SECRET:local-development-only-secret-key-never-use-this-in-prod}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # Anonymous callers (load balancers, orchestrators) only get UP / DOWN, never details.
      show-details: never
      probes:
        enabled: true
      group:
        # Liveness: "is the process alive?" Never depends on other systems, or a database outage would
        # make the orchestrator restart healthy instances in a loop.
        liveness:
          include: livenessState
        # Readiness: "should traffic be sent here?" Only what the app truly cannot work without.
        # Redis, Kafka, mail and storage are deliberately NOT here: the app degrades without them.
        readiness:
          include: readinessState,db
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: worksphere-backend
    distribution:
      # Lets Prometheus compute latency percentiles (p95 / p99) across instances.
      percentiles-histogram:
        http.server.requests: true
