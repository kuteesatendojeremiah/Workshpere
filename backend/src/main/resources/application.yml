server:
  port: 8080

spring:
  application:
    name: worksphere-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/worksphere}
    username: ${DB_USER:worksphere}
    password: ${DB_PASSWORD:worksphere}
  data:
    web:
      pageable:
        default-page-size: 20
        # The Kanban board asks for 200 per column; anything larger is clamped, not honoured.
        max-page-size: 200
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

app:
  jwt:
    secret: ${JWT_SECRET:local-development-only-secret-key-never-use-this-in-prod}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}
