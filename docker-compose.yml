services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: worksphere
      POSTGRES_USER: ${DB_USER:-worksphere}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-worksphere}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
