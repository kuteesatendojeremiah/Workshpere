services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: worksphere
      POSTGRES_USER: ${DB_USER:-worksphere}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-worksphere}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    # No persistence: Redis only holds counters and caches that are safe to lose (ADR-007).
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

volumes:
  postgres-data:
