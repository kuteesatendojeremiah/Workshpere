services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: worksphere
      POSTGRES_USER: ${DB_USER:-worksphere}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-worksphere}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    # No persistence: Redis only holds counters and caches that are safe to lose (ADR-007).
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  kafka:
    # Single-node KRaft broker (no ZooKeeper) for local development only.
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  minio:
    # S3-compatible object storage for attachments. MinIO no longer publishes images to Docker Hub;
    # this is the last Bitnami build, fine for local development only (use managed S3 in production).
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-worksphere}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-worksphere-secret}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/bitnami/minio/data

  mailpit:
    # A fake mail server for development: catches every email; read them at http://localhost:8025
    image: axllent/mailpit:v1.20
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI

  # Optional: docker compose --profile observability up -d
  # Needs infra/observability/metrics-token (a file containing the same value as METRICS_TOKEN).
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - ./infra/observability/metrics-token:/etc/prometheus/metrics-token:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change-me}
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  minio-data:
  postgres-data:
