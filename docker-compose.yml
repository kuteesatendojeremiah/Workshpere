# WorkSphere local environment.
#
#   Infrastructure only (run the backend / frontend from your IDE):
#       docker compose up -d
#   The whole application in containers (open http://localhost:8081):
#       docker compose --profile app up --build
#   Plus Prometheus and Grafana:
#       docker compose --profile app --profile observability up --build
#
# Settings come from the environment or a .env file (copy .env.example, or run scripts/init-env.sh to
# generate strong random secrets). The ":-" defaults below are DEVELOPMENT values only; the backend
# refuses to start with them when APP_ENVIRONMENT=production (see ProductionConfigGuard).
#
# Infrastructure ports are bound to 127.0.0.1 so they are not reachable from other machines.

services:
  # ---------------------------------------------------------------- application (profile "app")
  backend:
    profiles: ["app"]
    build:
      context: ./backend
    image: worksphere-backend:local
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod            # JSON logs
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
      DB_URL: jdbc:postgresql://postgres:5432/worksphere
      DB_USER: ${DB_USER:-worksphere}
      DB_PASSWORD: ${DB_PASSWORD:-worksphere}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092    # the in-network listener (see the kafka service)
      MAIL_HOST: mailpit
      MAIL_FROM: ${MAIL_FROM:-no-reply@worksphere.local}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-worksphere}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-worksphere-secret}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-worksphere-files}
      JWT_SECRET: ${JWT_SECRET:-local-development-only-secret-key-never-use-this-in-prod}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-development-only-webhook-secret}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost:8081}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:8081}
      FORWARD_HEADERS_STRATEGY: framework     # trust nginx's X-Forwarded-* headers
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true} # a demo organization on an empty database
    ports:
      - "127.0.0.1:8080:8080"                 # direct access for debugging; the browser uses the frontend
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      # The runtime image has bash but no curl: speak HTTP over bash's /dev/tcp (plain sh has no /dev/tcp).
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /actuator/health/readiness HTTP/1.0\r\n\r\n' >&3 &&
          grep -q '"status":"UP"' <&3
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: worksphere-frontend:local
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      backend: {condition: service_healthy}

  # ----------------------------------------------------------------------------- infrastructure
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: worksphere
      POSTGRES_USER: ${DB_USER:-worksphere}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-worksphere}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-worksphere} -d worksphere"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    # No persistence: Redis only holds counters and caches that are safe to lose (ADR-007).
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    # Single-node KRaft broker (no ZooKeeper) for local development only.
    # Two listeners: INTERNAL for other containers (kafka:29092), EXTERNAL for your machine (localhost:9092).
    image: apache/kafka:3.8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  minio:
    # S3-compatible object storage for attachments. MinIO no longer publishes images to Docker Hub;
    # this is the last Bitnami build, fine for local development only (use managed S3 in production).
    image: bitnamilegacy/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-worksphere}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-worksphere-secret}
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  mailpit:
    # A fake mail server for development: catches every email; read them at http://localhost:8025
    image: axllent/mailpit:v1.20
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # web UI

  # ------------------------------------------------------------------ observability (optional)
  # Needs infra/observability/metrics-token (a file containing the same value as METRICS_TOKEN).
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - ./infra/observability/metrics-token:/etc/prometheus/metrics-token:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change-me}
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  minio-data:
  postgres-data:
