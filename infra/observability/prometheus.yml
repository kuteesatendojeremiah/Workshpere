# Prometheus: scrape the backend, evaluate the alert rules.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: worksphere-backend
    metrics_path: /actuator/prometheus
    # The same value as the backend's METRICS_TOKEN. Mounted from a file so it is not in this config.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      # host.docker.internal = the backend running on the developer's machine (outside docker-compose).
      - targets: ["host.docker.internal:8080"]
